<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        h1 {
            background-color: #4CAF50;
            color: white;
            padding: 20px 0;
            margin: 0;
        }
        form {
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
            text-align: left;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1>Fraud Detection on Bank Payments</h1>
    <div class="container">
        <form action="/predict" method="post">
            <label for="step">Step:</label>
            <input type="number" id="step" name="step" placeholder="Enter step (e.g., 1, 2, 3...)" required>
            
            <label for="customer">Customer ID:</label>
            <input type="number" id="customer" name="customer" placeholder="Enter customer ID" required>
            
            <label for="age">Age:</label>
            <select id="age" name="age" required>
                <option value="0">Below 18</option>
                <option value="1">18-25</option>
                <option value="2">26-35</option>
                <option value="3">36-45</option>
                <option value="4">46-55</option>
                <option value="5">56-65</option>
                <option value="6">Above 65</option>
            </select>
            
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="1">Male</option>
                <option value="2">Female</option>
            </select>
            
            <label for="merchant">Merchant ID:</label>
            <input type="number" id="merchant" name="merchant" placeholder="Enter merchant ID" required>
            
            <label for="category">Category:</label>
            <select id="category" name="category" required>
                <option value="1">Bars and Restaurants</option>
                <option value="2">Fashion</option>
                <option value="3">Health</option>
                <option value="4">Home</option>
                <option value="5">Hotel Services</option>
                <option value="6">Hyper</option>
                <option value="7">Leisure</option>
                <option value="8">Others</option>
                <option value="9">Sports and Toys</option>
                <option value="10">Tech</option>
                <option value="11">Travel</option>
                <option value="12">Wellness and Beauty</option>
            </select>
            
            <label for="amount">Transaction Amount:</label>
            <input type="number" id="amount" name="amount" placeholder="Enter transaction amount" step="0.01" required>
            
            <button type="submit">Predict</button>
        </form>
        <!-- Display prediction result -->
        {% if prediction_text %}
        <p>{{ prediction_text }}</p>
        {% endif %}
    </div>
</body>
</html>
